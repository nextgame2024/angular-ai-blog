<div class="select" [class.open]="open">
  <button
    type="button"
    class="select-trigger"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-expanded]="open"
    [disabled]="disabled"
    (click)="toggle($event)"
    >
    <span class="value" [class.placeholder]="!selectedLabel">
      {{ selectedLabel || placeholder }}
    </span>
    <span class="chevron" aria-hidden="true">
      <svg viewBox="0 0 20 20">
        <path d="M6 8l4 4 4-4"></path>
      </svg>
    </span>
  </button>

  @if (open) {
    <div #menu class="select-menu" [style]="menuStyles" [class.opens-up]="panelDirection === 'up'">
      @if (searchable) {
        <input class="select-search" type="search" [value]="searchTerm" (input)="searchTerm = $any($event.target).value" (click)="$event.stopPropagation()" placeholder="Search…" aria-label="Search options" />
      }
      @for (opt of filteredOptions; track opt) {
        <button
          type="button"
          class="select-option"
          [class.is-active]="opt.value === value"
          (click)="selectOption(opt, $event)"
          >
          <span>{{ opt.label }}</span>
          @if (opt.value === value) {
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M4 10l4 4 8-8"></path>
              </svg>
            </span>
          }
        </button>
      }
      @if (searchable && filteredOptions.length === 0) { <span class="select-empty">No matches</span> }
    </div>
  }
</div>
