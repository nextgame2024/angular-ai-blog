@if(message){<app-manager-toast [message]="message" [tone]="tone" (closed)="message=''"></app-manager-toast>}
@if(status==='pre_sale'){
  <div class="checklist" [attr.aria-busy]="loading || busy">
    <p class="hint" aria-live="polite">{{complete}} of {{items.length || 4}} complete</p>
    @if(!caseId){<p class="hint">Save the case to start its checklist.</p>}
    @if(loading || busy){<div class="loader"><app-manager-list-loader [label]="busy?'Saving checklist…':'Loading checklist…'" [overlay]="true"></app-manager-list-loader></div>}
    @if(failed){<button type="button" class="retry" (click)="load()">Reload checklist</button>}
    @for(item of items;track item.key){
      <label class="checklist-item" [class.completed]="item.completed">
        <span>{{item.label}}@if(item.automatic){<small>{{item.hint}}</small>}</span>
        <input type="checkbox" [checked]="item.completed" (change)="toggle(item,$event)"
          [disabled]="item.automatic || !caseId || !canManage || disabled || loading || busy || failed" />
      </label>
    }
  </div>
} @else {
  <p class="empty">No checklist is configured for this case status yet.</p>
}
