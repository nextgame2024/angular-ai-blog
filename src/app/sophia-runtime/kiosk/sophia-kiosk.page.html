<main class="sophia-runtime-shell">
  <section class="stage" aria-label="Sophia runtime kiosk">
    <div class="avatar-panel">
      <div class="avatar-video">
        <div class="stage-toolbar">
          <label class="experience-select" for="sophia-experience">
            <span class="visually-hidden">Experience</span>
            <select id="sophia-experience" aria-label="Sophia experience" [ngModel]="experience$$()" (ngModelChange)="setExperience($event)" [disabled]="!canStart$$()">
              <option *ngFor="let option of avatarOptions" [value]="option.value">{{ option.label }}</option>
            </select>
          </label>
          <div class="signal" [class.live]="state$$() === 'active'"><span></span>{{ state$$() === 'active' ? 'Live' : 'Standby' }}</div>
        </div>

        <video #avatarVideo class="avatar-stream" autoplay playsinline [class.connected]="isAvatarConnected$$()" [class.full-stage]="isFullStage$$()" [class.premium-stage]="isPremiumExperience$$()"></video>
        <video *ngIf="!isAvatarConnected$$() && usesVideoStandby$$() && !standbyVideoFailed$$()" class="standby-video" autoplay muted loop playsinline preload="auto" poster="assets/avatars/SophiaAvatarSIMIL.jpg" aria-label="Sophia AI standing by" (error)="standbyVideoFailed$$.set(true)">
          <source src="https://files-nodejs-api.s3.ap-southeast-2.amazonaws.com/public/avatars/SophiaAiStandByPhone.mp4" type="video/mp4" media="(max-width: 700px)" />
          <source src="https://files-nodejs-api.s3.ap-southeast-2.amazonaws.com/public/avatars/SophiaAiStandBy.mp4" type="video/mp4" />
        </video>
        <picture *ngIf="!isAvatarConnected$$() && !usesVideoStandby$$()" class="experience-standby" [class.premium-standby]="isPremiumExperience$$()">
          <source media="(max-width: 700px)" [srcset]="standbyMobileImage$$()" />
          <img [src]="standbyImage$$()" alt="Sophia AI avatar" />
        </picture>
        <img *ngIf="!isAvatarConnected$$() && usesVideoStandby$$() && standbyVideoFailed$$()" src="assets/avatars/SophiaAvatarSIMIL.jpg" alt="Sophia AI avatar" />
        <audio #remoteAudio autoplay></audio>
        <audio #avatarAudio autoplay muted></audio>

        <app-sophia-presentation-host [busy]="activeTask$$() !== null" />

        <form *ngIf="state$$() === 'active'" class="text-fallback" aria-label="Type a message to Sophia" (ngSubmit)="submitText()">
          <label for="sophia-text-input">Prefer typing or cannot use the microphone?</label>
          <div>
            <input id="sophia-text-input" name="sophiaTextInput" type="text" autocomplete="off" maxlength="2000" [ngModel]="textInput$$()" (ngModelChange)="textInput$$.set($event)" placeholder="Type your message" />
            <button type="submit" [disabled]="!textInput$$().trim()">Send</button>
          </div>
          <p *ngIf="assistantText$$()" class="assistant-text" aria-live="polite">{{ assistantText$$() }}</p>
        </form>

        <div class="session-overlay" aria-label="Session controls">
          <div class="runtime-status" aria-live="polite"><span [class.live]="isVoiceConnected$$()"></span>{{ runtimeStatus$$() }}</div>
          <div class="actions">
            <button type="button" class="session-action start-action" [disabled]="!canStart$$()" (click)="startSession()"><span>{{ state$$() === 'starting' ? 'Starting' : 'Start' }}</span></button>
            <button type="button" class="session-action finish-action" [disabled]="!canFinish$$()" (click)="finishSession()"><span>{{ state$$() === 'closing' ? 'Finishing' : 'Finish' }}</span></button>
          </div>
        </div>

        <p class="avatar-warning" *ngIf="isAvatarUnavailable$$()">{{ avatarStatus$$() }}</p>
        <p class="error" *ngIf="error$$()">{{ error$$() }}</p>
      </div>
    </div>
  </section>
</main>
