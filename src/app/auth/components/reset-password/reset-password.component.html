<section class="reset-page">
  <main class="reset-shell">
    <div class="reset-card-wrap">
      <p-card header="Create New Password" styleClass="w-full m-0">
        <p class="reset-copy">
          Choose a new password for your Sophia AI account. Use at least 8
          characters.
        </p>

        @if (successMessage$$()) {
          <div class="reset-notice success">{{ successMessage$$() }}</div>
        }

        @if (errorMessage$$()) {
          <div class="reset-notice error">{{ errorMessage$$() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-form">
          <p-inputgroup>
            <p-inputgroup-addon><i class="pi pi-lock"></i></p-inputgroup-addon>
            <p-password
              formControlName="password"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full flex-auto block"
              inputStyleClass="p-inputtext w-full"
              [inputStyle]="{ width: '100%' }"
              placeholder="New password"
            ></p-password>
          </p-inputgroup>

          <p-inputgroup>
            <p-inputgroup-addon><i class="pi pi-check"></i></p-inputgroup-addon>
            <p-password
              formControlName="confirmPassword"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full flex-auto block"
              inputStyleClass="p-inputtext w-full"
              [inputStyle]="{ width: '100%' }"
              placeholder="Confirm password"
            ></p-password>
          </p-inputgroup>

          @if (passwordsDoNotMatch$$()) {
            <div class="field-error">Passwords do not match.</div>
          }

          <button
            pButton
            type="submit"
            label="Update password"
            class="w-full"
            [disabled]="
              form.invalid ||
              passwordsDoNotMatch$$() ||
              !token ||
              isSubmitting$$()
            "
          ></button>

          <a routerLink="/login" class="login-link">Back to sign in</a>
        </form>
      </p-card>
    </div>
  </main>
</section>
